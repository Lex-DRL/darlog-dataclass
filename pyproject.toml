# https://packaging.python.org/en/latest/tutorials/packaging-projects/

[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "darlog-dataclass"
#dynamic = ["version"]
version = "0.0.1a0"
description = "ABSOLUTELY essential utils for dataclasses, that should've always been there. No bloat."
authors = [
	{ name="Lex Darlog (Lex-DRL)" },
]
readme = "README.md"
# https://packaging.python.org/en/latest/specifications/core-metadata/#license-expression
# https://spdx.org/licenses/
license = "MPL-2.0"
license-files = ["LICEN[CS]E*"]
requires-python = ">=3.7"
dependencies = []
classifiers = [
	"Programming Language :: Python :: 3",
	"Operating System :: OS Independent",
#	"License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",  # should be detected automatically from `license = `
]

[project.urls]
"Source Code" = "https://github.com/Lex-DRL/darlog-dataclass"
Issues = "https://github.com/Lex-DRL/darlog-dataclass/issues"

# [tool.hatch.version]
# path = "src/darlog/dataclass/___package_meta.py"

[tool.hatch.build.targets.wheel]
packages = ["src/darlog"]

